<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oral Lesion Diagnosis - Professional</title>
    <script src="https://cdn.tailwindcss.com/"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
            transition: background-color 0.3s ease;
        }

        .card {
            background-color: #ffffff;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .glow-button {
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        
        .glow-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300%;
            height: 300%;
            background-color: rgba(255, 255, 255, 0.15);
            transition: all 0.6s ease;
            transform: translate(-50%, -50%) rotate(45deg);
            z-index: -1;
            opacity: 0;
        }

        .glow-button:hover::before {
            opacity: 1;
            transform: translate(-50%, -50%) rotate(0deg);
        }

        .fade-in-up {
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100 p-4">

    <div class="card container mx-auto p-6 md:p-10 rounded-3xl w-full max-w-3xl text-center">
        <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-2">Oral Lesion Diagnosis</h1>
        <p class="text-md md:text-lg text-gray-600 mb-8">
            Metaheuristic-Guided AI for Malignancy Detection.
        </p>

        <!-- Main Diagnosis Interface -->
        <div id="main-interface" class="flex flex-col items-center">
            <!-- Upload Area - NOW USES LABEL TAG FOR RELIABLE CLICK -->
            <label for="file-input" id="drop-area" class="w-full h-64 border-2 border-dashed border-gray-300 rounded-2xl flex flex-col items-center justify-center transition-all duration-300 cursor-pointer hover:border-blue-500 hover:bg-blue-50 mb-8">
                <input type="file" id="file-input" class="hidden" accept="image/*">
                <svg class="w-16 h-16 text-gray-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                <p class="text-gray-500 font-medium">Drag & Drop Your Image</p>
                <p class="text-gray-400 text-sm mt-1">or click to browse</p>
            </label>
            <!-- END Upload Area -->

            <!-- Preview and Diagnose Button -->
            <div id="preview-section" class="hidden w-full mb-8 fade-in-up">
                <img id="image-preview" src="#" alt="Image Preview" class="w-full h-auto rounded-xl shadow-md mb-6 border-4 border-white object-cover">
                <button id="diagnose-button" class="glow-button w-full px-8 py-4 bg-gradient-to-r from-green-500 to-green-600 text-white rounded-xl font-bold text-lg hover:from-green-600 hover:to-green-700 transition transform hover:scale-105" disabled>
                    Diagnose Lesion
                </button>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading-indicator" class="hidden flex flex-col items-center pt-8">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-500 mb-4"></div>
            <p class="text-gray-600 font-semibold text-lg">Analyzing image using metaheuristics...</p>
        </div>

        <!-- Results Display Area -->
        <div id="results-container" class="hidden w-full text-left fade-in-up">
            <h2 class="text-2xl font-bold text-gray-800 mb-4 border-b-2 border-gray-200 pb-2">Final Diagnosis</h2>
            
            <div class="p-6 bg-gray-50 rounded-xl shadow-inner mb-6">
                <div id="diagnosis-text" class="text-3xl font-bold mb-2"></div>
                <div id="explanation-text" class="text-lg text-gray-600 italic"></div>
                <button id="detailed-explanation-button" class="glow-button mt-4 px-4 py-2 bg-blue-500 text-white rounded-lg font-semibold text-sm hover:bg-blue-600 transition">
                    ✨ Get Detailed Explanation
                </button>
            </div>

            <!-- Image Container (Original vs. XAI) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <!-- Original Image Column -->
                <div class="p-4 bg-white rounded-xl shadow-lg border-2 border-gray-200">
                    <h3 class="text-xl font-semibold mb-2 text-gray-700 text-center">Original Lesion</h3>
                    <img id="original-result-image" src="#" class="w-full max-w-lg mx-auto rounded-xl shadow-md">
                </div>
                
                <!-- XAI Heatmap Column -->
                <div class="p-4 bg-white rounded-xl shadow-lg border-2 border-gray-200">
                    <h3 class="text-xl font-semibold mb-2 text-gray-700 text-center">AI Focus (Grad-CAM)</h3>
                    <div class="relative overflow-hidden rounded-xl">
                         <img id="heatmap-result-image" src="#" class="w-full mx-auto shadow-md transform scale-150 origin-top-left transition-transform duration-500">
                    </div>
                    <p class="mt-2 text-xs text-gray-500 text-center">Heatmap showing regions used for decision.</p>
                </div>
            </div>


            <!-- Detailed LLM Explanation Area -->
            <div id="llm-explanation-area" class="p-4 bg-yellow-50 rounded-xl hidden mb-6 border border-yellow-300">
                <h3 class="font-bold text-yellow-700 mb-2">LLM-Generated Insights for the detected disease:</h3>
                <p id="llm-explanation-content" class="text-gray-700 text-sm"></p>
            </div>

            <!-- Terminology Explainer -->
            <div class="p-4 bg-gray-100 rounded-xl mb-6">
                <h3 class="font-bold text-gray-700 mb-2">Medical Terminology Explainer</h3>
                <div class="flex space-x-2">
                    <input type="text" id="term-input" placeholder="e.g., Leukoplakia" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="explain-term-button" class="px-4 py-2 bg-purple-600 text-white rounded-lg font-semibold hover:bg-purple-700 transition">
                        Explain
                    </button>
                </div>
                <p id="term-definition" class="mt-2 text-gray-600 italic text-sm"></p>
            </div>

            <!-- Reset Button -->
            <button id="reset-button" class="glow-button w-full px-8 py-3 bg-gray-800 text-white rounded-xl font-bold text-lg hover:bg-gray-900 transition">
                New Diagnosis
            </button>
        </div>

    <script>
        const dropArea = document.getElementById('drop-area');
        const fileInput = document.getElementById('file-input');
        const previewSection = document.getElementById('preview-section');
        const diagnoseButton = document.getElementById('diagnose-button');
        const imagePreview = document.getElementById('image-preview');
        const loadingIndicator = document.getElementById('loading-indicator');
        const mainInterface = document.getElementById('main-interface');
        const resultsContainer = document.getElementById('results-container');
        const diagnosisText = document.getElementById('diagnosis-text');
        const explanationText = document.getElementById('explanation-text');
        const originalResultImage = document.getElementById('original-result-image');
        const heatmapResultImage = document.getElementById('heatmap-result-image');
        const detailedExplanationButton = document.getElementById('detailed-explanation-button');
        const llmExplanationArea = document.getElementById('llm-explanation-area');
        const llmExplanationContent = document.getElementById('llm-explanation-content');
        const termInput = document.getElementById('term-input');
        const explainTermButton = document.getElementById('explain-term-button');
        const termDefinition = document.getElementById('term-definition');
        const resetButton = document.getElementById('reset-button');

        let uploadedImageFile = null;
        let finalDiagnosis = null;

        // --- Utility Functions ---
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, preventDefaults, false);
        });
        function preventDefaults(e) {
            e.preventDefault(); e.stopPropagation();
        }
        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => dropArea.classList.add('border-blue-500', 'bg-blue-50'), false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => dropArea.classList.remove('border-blue-500', 'bg-blue-50'), false);
        });

        dropArea.addEventListener('drop', handleDrop, false);
        
        // Removed conflicting click listener, relying on the <label for="file-input"> tag.
        
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
        
        // Attach reload function safely using an event listener
        resetButton.addEventListener('click', () => window.location.reload());

        function handleDrop(e) {
            const dt = e.dataTransfer;
            handleFiles(dt.files);
        }

        function handleFiles(files) {
            if (files.length === 0) return;
            uploadedImageFile = files[0];
            previewFile(uploadedImageFile);
            diagnoseButton.disabled = false;
        }

        function previewFile(file) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onloadend = () => {
                imagePreview.src = reader.result;
                dropArea.classList.add('hidden');
                previewSection.classList.remove('hidden');
            }
        }

        // --- Primary Diagnosis Logic ---
        diagnoseButton.addEventListener('click', async () => {
            if (!uploadedImageFile) return;

            mainInterface.classList.add('hidden');
            loadingIndicator.classList.remove('hidden');

            const formData = new FormData();
            formData.append('image', uploadedImageFile);

            try {
                // Send image to the Python backend server on port 9001
                const response = await fetch('http://127.0.0.1:9001/diagnose', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                
                const result = await response.json();
                
                finalDiagnosis = result.diagnosis;

                // 1. Update Diagnosis Text
                diagnosisText.textContent = finalDiagnosis;
                if (finalDiagnosis.toLowerCase().includes('benign')) {
                    diagnosisText.className = 'text-3xl font-bold mb-2 text-green-600';
                } else {
                    diagnosisText.className = 'text-3xl font-bold mb-2 text-red-600';
                }
                explanationText.textContent = `${result.explanation}`;

                // 2. Display Images
                originalResultImage.src = imagePreview.src;
                
                // Set the heatmap (which is base64 encoded)
                if (result.heatmap_image) {
                     heatmapResultImage.src = `data:image/jpeg;base64,${result.heatmap_image}`;
                } else {
                     // Since Grad-CAM is likely failing, use the original image for the zoomed view
                     // This fulfills the user's request for a zoomed image in that box.
                     heatmapResultImage.src = originalResultImage.src; 
                }
                
            } catch (error) {
                console.error("Diagnosis failed:", error);
                diagnosisText.textContent = 'Classification: Diagnosis Failed';
                diagnosisText.className = 'text-3xl font-bold mb-2 text-red-700';
                explanationText.textContent = 'An error occurred while connecting to the server. Please ensure the backend is running and the necessary files are loaded.';
                originalResultImage.src = 'https://placehold.co/400x300/f87171/ffffff?text=SERVER+ERROR';
                heatmapResultImage.src = 'https://placehold.co/400x300/f87171/ffffff?text=XAI+ERROR';
            } finally {
                loadingIndicator.classList.add('hidden');
                resultsContainer.classList.remove('hidden');
            }
        });


        // --- LLM Detailed Explanation Logic ---
        detailedExplanationButton.addEventListener('click', async () => {
            detailedExplanationButton.textContent = 'Generating...';
            detailedExplanationButton.disabled = true;
            llmExplanationContent.textContent = 'Loading detailed insights...';
            llmExplanationArea.classList.remove('hidden');

            try {
                const response = await fetch('http://127.0.0.1:9001/get_explanation', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ diagnosis: finalDiagnosis })
                });

                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                
                const result = await response.json();
                llmExplanationContent.textContent = result.explanation;

            } catch (error) {
                console.error("LLM Explanation failed:", error);
                llmExplanationContent.textContent = "Could not load detailed explanation. Check API key or network connection.";
            } finally {
                detailedExplanationButton.textContent = 'Get Detailed Explanation 🫧';
                detailedExplanationButton.disabled = false;
            }
        });
        
        // --- LLM Terminology Explainer Logic ---
        explainTermButton.addEventListener('click', async () => {
            const term = termInput.value.trim();
            if (!term) return;

            explainTermButton.textContent = 'Defining...';
            explainTermButton.disabled = true;
            termDefinition.textContent = 'Searching...';

            try {
                const response = await fetch('http://127.0.0.1:9001/explain_term', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ term: term })
                });

                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                
                const result = await response.json();
                termDefinition.textContent = `Definition of "${term}": ${result.definition}`;

            } catch (error) {
                console.error("Term explanation failed:", error);
                termDefinition.textContent = `Could not define the term. Check network connection.`;
            } finally {
                explainTermButton.textContent = 'Explain';
                explainTermButton.disabled = false;
            }
        });
    </script>

</body>
</html>
